packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: true
  esbuild: true

# @fastify/multipart adds its request types to `fastify` but does not declare it, so without this
# pnpm leaves `fastify` out of its reach and those types are lost.
packageExtensions:
  "@fastify/multipart":
    peerDependencies:
      fastify: "5"
