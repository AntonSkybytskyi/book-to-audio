# nginx is the only published port. web and core are reached through it, and core reaches the TTS
# services; none of them is published.
services:
  nginx:
    build:
      context: .
      dockerfile: apps/edge/Dockerfile
    image: book-to-audio-edge
    # Published on localhost only. Exposing it to a network is not secured in v1.
    ports:
      - "127.0.0.1:${BOOK_TO_AUDIO_PORT:-3000}:8080"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The pages only. All their data comes from core through nginx, in the browser.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: book-to-audio-web
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The API, the conversion pool, the downloads and the database. Restarting web does not touch it.
  core:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: book-to-audio-core
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      # name=url of each TTS service, in the order a language's default voice is looked for.
      TTS_SERVICES: ${TTS_SERVICES:-piper=http://piper-api:5000}
    volumes:
      - book-data:/data
    depends_on:
      piper-api:
        condition: service_healthy
    restart: unless-stopped
    # Reap ffmpeg child processes.
    init: true
    # Limits, so a hostile or broken book cannot take over the machine.
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Reads text aloud with Piper and the voices baked into its image (TTS service API, see
  # packages/contracts/openapi/tts-service.yaml). Holds no data: it only writes scratch WAV files.
  piper-api:
    build:
      context: .
      dockerfile: apps/piper-api/Dockerfile
    image: book-to-audio-piper
    environment:
      # Requests read at once, and the most Piper processes alive; default half the CPU cores.
      PIPER_CONCURRENCY: ${PIPER_CONCURRENCY:-}
    restart: unless-stopped
    # Reap Piper processes.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    # Each warm Piper process holds its voice model in memory, up to about 0.8 GB while it reads:
    # 6 processes (PIPER_CONCURRENCY on 12 cores) peaked at 4.9 GB in the speed test.
    mem_limit: ${PIPER_MEM_LIMIT:-6g}
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Lint, format check, typecheck and tests inside a container:
  #   docker compose run --rm check
  check:
    build:
      context: .
      dockerfile: Dockerfile.check
    profiles: [tools]
    command: pnpm check

volumes:
  book-data:
