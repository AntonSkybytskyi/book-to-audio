# nginx is the only published port. web and core are reached through it and are not published.
services:
  nginx:
    build:
      context: .
      dockerfile: apps/edge/Dockerfile
    image: book-to-audio-edge
    # Published on localhost only. Exposing it to a network is not secured in v1.
    ports:
      - "127.0.0.1:${BOOK_TO_AUDIO_PORT:-3000}:8080"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The pages only. All their data comes from core through nginx, in the browser.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: book-to-audio-web
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The API, the conversion pool, the downloads and the database. Restarting web does not touch it.
  core:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: book-to-audio-core
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      - book-data:/data
    restart: unless-stopped
    # Reap ffmpeg / Piper child processes.
    init: true
    # Limits, so a hostile or broken book cannot take over the machine.
    mem_limit: 3g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Lint, format check, typecheck and tests inside a container:
  #   docker compose run --rm check
  check:
    build:
      context: .
      dockerfile: Dockerfile.check
    profiles: [tools]
    command: pnpm check

volumes:
  book-data:
